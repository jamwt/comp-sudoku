name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy-preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy Convex preview, build the frontend, and host it on the preview
        run: |
          set -o pipefail
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::notice::CONVEX_DEPLOY_KEY secret is not set; skipping the preview deploy."
            exit 0
          fi
          npx convex deploy \
            --preview-create "$BRANCH" \
            --preview-run puzzles:seed \
            --cmd 'npx vite build' \
            --cmd-url-env-var-name VITE_CONVEX_URL
          npm run upload:static -- "$BRANCH" | tee upload.log
          url=$(grep -o 'https://[^ ]*\.convex\.site' upload.log | tail -1)
          if [ -z "$url" ]; then
            echo "::error::The upload did not report a site URL."
            exit 1
          fi
          body="<!-- convex-preview -->Playable preview of ${HEAD_SHA::7}: $url"
          echo "### Playable preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Playable preview: $url"
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          id=$(gh api "$comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- convex-preview -->"))) | .id' | tail -1) &&
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "$comments" -f body="$body" > /dev/null
          fi ||
            echo "::warning::Could not comment the preview URL on the pull request."
